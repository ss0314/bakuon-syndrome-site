<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>セトリ / Setlist · 爆音メトロノーム</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="爆音メトロノーム / Bakuon Metronome">
<meta property="og:title" content="爆音メトロノームのセトリ / Bakuon Metronome setlist">
<meta property="og:description" content="開くとアプリに取り込めます。 / Open to import it into the app.">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{font-family:-apple-system,"Hiragino Sans","Helvetica Neue",sans-serif;background:#000;color:#fff;margin:0;padding:max(24px,env(safe-area-inset-top)) 20px 64px;line-height:1.6;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto}
.app{color:#FF6A00;font-weight:700;font-size:14px;letter-spacing:.04em;margin:0 0 6px}
h1{font-size:30px;line-height:1.25;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.sub{color:#999;margin:4px 0 22px;font-size:15px}
.btn{display:block;background:#FF6A00;color:#000;text-decoration:none;font-weight:800;font-size:18px;text-align:center;padding:16px 20px;border-radius:14px}
.btn:active{opacity:.85}
.note{color:#999;font-size:13px;margin:12px 0 0;text-align:center}
.note a{color:#FF6A00;font-weight:600}
ol{list-style:none;margin:32px 0 0;padding:0;border-top:1px solid #222}
li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #222}
.n{width:22px;color:#777;font-size:13px;font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0}
.title{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.meta{color:#999;font-size:12px}
.bpm{font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.err{margin-top:40px;color:#ddd;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<p class="app">爆音メトロノーム · Bakuon Metronome</p>
<h1 id="name">セトリ</h1>
<p id="count" class="sub"></p>
<a id="open" class="btn" href="#">爆音メトロノームで開く</a>
<p id="hint" class="note">アプリが入っていれば、上のボタンで取り込めます。<br><a id="store" href="https://apps.apple.com/app/id6825362044">App Store で入手</a></p>
<ol id="songs"></ol>
<p id="error" class="err" hidden>このリンクは読み込めませんでした。</p>
</main>
<script>
(function () {
  var ja = (navigator.language || '').toLowerCase().indexOf('ja') === 0;
  var T = ja ? {
    title: 'セトリ', open: '爆音メトロノームで開く', store: 'App Store で入手',
    hint: 'アプリが入っていれば、上のボタンで取り込めます。', error: 'このリンクは読み込めませんでした。',
    songs: function (n) { return n + '曲'; }, countIn: function (n) { return 'カウント ' + n; },
    sub: { quarter: '4分', eighth: '8分', sixteenth: '16分', triplet: '3連', shuffle: 'シャッフル' }
  } : {
    title: 'Setlist', open: 'Open in Bakuon Metronome', store: 'Get it on the App Store',
    hint: 'If the app is installed, the button above imports this setlist.', error: 'This link could not be read.',
    songs: function (n) { return n + (n === 1 ? ' song' : ' songs'); }, countIn: function (n) { return 'Count-in ' + n; },
    sub: { quarter: 'Quarter', eighth: '8th', sixteenth: '16th', triplet: 'Triplet', shuffle: 'Shuffle' }
  };
  if (!ja) document.documentElement.lang = 'en';
  var $ = function (id) { return document.getElementById(id); };
  $('open').textContent = T.open; $('store').textContent = T.store; $('error').textContent = T.error;
  $('hint').firstChild.textContent = T.hint;

  var frag = location.hash.slice(1);
  $('open').href = 'bakuonmetronome://setlist#' + frag;

  function decode(b64url) {
    var s = b64url.replace(/-/g, '+').replace(/_/g, '/');
    if (s.length % 4) s += '===='.slice(s.length % 4);
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  function fail() { $('error').hidden = false; $('open').hidden = true; $('hint').hidden = true; $('count').hidden = true; $('name').textContent = T.title; }

  var p;
  try {
    if (!frag || frag.length > 65536) throw new Error('empty');
    p = JSON.parse(decode(frag));
    if (!p || p.v !== 1 || typeof p.n !== 'string' || !Array.isArray(p.s) || !p.s.length) throw new Error('shape');
  } catch (e) { fail(); return; }

  $('name').textContent = p.n || T.title;
  $('count').textContent = T.songs(p.s.length);
  document.title = (p.n || T.title) + ' · ' + (ja ? '爆音メトロノーム' : 'Bakuon Metronome');
  var list = $('songs');
  p.s.forEach(function (song, i) {
    var li = document.createElement('li');
    var n = document.createElement('span'); n.className = 'n'; n.textContent = i + 1;
    var t = document.createElement('div'); t.className = 't';
    var title = document.createElement('div'); title.className = 'title'; title.textContent = String(song.t || '');
    var meta = document.createElement('div'); meta.className = 'meta';
    var parts = [];
    if (Array.isArray(song.ts) && song.ts.length === 2) parts.push(song.ts[0] + '/' + song.ts[1]);
    if (song.u && T.sub[song.u]) parts.push(T.sub[song.u]);
    if (song.c > 0) parts.push(T.countIn(song.c));
    meta.textContent = parts.join(' · ');
    t.appendChild(title); if (parts.length) t.appendChild(meta);
    var bpm = document.createElement('span'); bpm.className = 'bpm'; bpm.textContent = Math.round(Number(song.b) || 0);
    li.appendChild(n); li.appendChild(t); li.appendChild(bpm);
    list.appendChild(li);
  });
})();
</script>
</body>
</html>
